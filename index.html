<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <form id="formTask">
            <header>
                <h1>To-do List</h1>
            </header>
            <div class="inputGroup">
                <label for="inputTask">Add a new task:</label>
                <input type="text" name="inputTask" id="inputTask" class="inputTask" placeholder="Write a task">
            </div>
            <button class="addTask" type="submit">Add task</button>
            <button class="clearList" type="reset">Clear list</button>
        </form>

        <ul class="listTask" id="listTask"></ul>
    </main>
</body>
</html>
